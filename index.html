<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Adapte l'affichage à l'écran du téléphone, y compris l'encoche de l'iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Budget</title>
  <meta name="description" content="Mon budget du mois, en enveloppes.">

  <!-- Couleur de la barre du haut, en mode clair et en mode sombre -->
  <meta name="theme-color" content="#F2F4F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121A18" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- Installation sur iPhone (écran d'accueil) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <!-- Police Manrope, stockée dans l'appli (fonctionne hors connexion) -->
  <link rel="preload" href="fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barre du haut : reste du mois, toujours accessible -->
  <header class="barre-haut" id="barre-haut">
    <span class="barre-titre" id="barre-titre">Budget</span>
    <span class="barre-reste"><span class="barre-etiquette">Reste</span><span class="chiffre" id="barre-montant">–</span></span>
  </header>

  <!-- Les 4 onglets -->
  <main id="contenu">
    <section class="vue" id="vue-budget" aria-label="Budget"></section>
    <section class="vue" id="vue-historique" aria-label="Historique" hidden></section>
    <section class="vue" id="vue-stats" aria-label="Statistiques" hidden></section>
    <section class="vue" id="vue-reglages" aria-label="Réglages" hidden></section>
  </main>

  <!-- Barre d'onglets en bas -->
  <nav class="onglets" aria-label="Navigation">
    <button class="onglet actif" data-vue="budget">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M4 8l8 5.5L20 8"/></svg>
      <span>Budget</span>
    </button>
    <button class="onglet" data-vue="historique">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>Historique</span>
    </button>
    <button class="ajouter" id="bouton-ajouter" aria-label="Ajouter une dépense ou un revenu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="onglet" data-vue="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12z"/><path d="M15 3.8A8.5 8.5 0 0 1 20.2 9H15z"/></svg>
      <span>Statistiques</span>
    </button>
    <button class="onglet" data-vue="reglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span>Réglages</span>
    </button>
  </nav>

  <!-- Panneau qui monte du bas (saisie, modification) -->
  <div class="voile" id="voile" hidden></div>
  <div class="panneau" id="panneau" role="dialog" aria-modal="true" hidden></div>

  <!-- Fenêtre de confirmation -->
  <div class="confirm-fond" id="confirm" hidden>
    <div class="confirm-boite" role="alertdialog" aria-modal="true">
      <p class="confirm-titre" id="confirm-titre"></p>
      <p class="confirm-texte" id="confirm-texte"></p>
      <div class="confirm-boutons">
        <button class="btn btn-discret" id="confirm-non">Annuler</button>
        <button class="btn btn-principal" id="confirm-oui">Confirmer</button>
      </div>
    </div>
  </div>

  <!-- Petit message temporaire -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Sélecteur de fichier pour l'import (caché) -->
  <input type="file" id="fichier-import" accept="application/json,.json" hidden>

  <noscript>Cette application a besoin de JavaScript pour fonctionner.</noscript>
  <script src="app.js"></script>
</body>
</html>
