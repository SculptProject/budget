<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Adapte l'affichage à l'écran du téléphone, y compris l'encoche de l'iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Budget</title>
  <meta name="description" content="Mon budget du mois, en enveloppes.">

  <!-- Couleur de la barre du haut, en mode clair et en mode sombre -->
  <meta name="theme-color" content="#EDF0EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121715" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- Installation sur iPhone (écran d'accueil) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Bandeau du haut : reste global, toujours visible -->
  <header class="global" id="global">
    <div class="global-ligne">
      <span class="global-titre" id="global-mois">Ce mois-ci</span>
      <span class="global-sur" id="global-sur"></span>
    </div>
    <div class="global-montant" id="global-reste">–</div>
    <div class="global-barre"><div class="global-barre-remplie" id="global-barre"></div></div>
  </header>

  <!-- Les 4 onglets -->
  <main id="contenu">
    <section class="vue" id="vue-budget" aria-label="Budget"></section>
    <section class="vue" id="vue-historique" aria-label="Historique" hidden></section>
    <section class="vue" id="vue-stats" aria-label="Statistiques" hidden></section>
    <section class="vue" id="vue-reglages" aria-label="Réglages" hidden></section>
  </main>

  <!-- Barre d'onglets en bas -->
  <nav class="onglets" aria-label="Navigation">
    <button class="onglet actif" data-vue="budget">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 8l9 6 9-6"/></svg>
      <span>Budget</span>
    </button>
    <button class="onglet" data-vue="historique">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
      <span>Historique</span>
    </button>
    <button class="ajouter" id="bouton-ajouter" aria-label="Ajouter une dépense">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="onglet" data-vue="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
      <span>Stats</span>
    </button>
    <button class="onglet" data-vue="reglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
      <span>Réglages</span>
    </button>
  </nav>

  <!-- Panneau qui monte du bas (saisie, modification) -->
  <div class="voile" id="voile" hidden></div>
  <div class="panneau" id="panneau" role="dialog" aria-modal="true" hidden></div>

  <!-- Fenêtre de confirmation -->
  <div class="confirm-fond" id="confirm" hidden>
    <div class="confirm-boite" role="alertdialog" aria-modal="true">
      <p class="confirm-titre" id="confirm-titre"></p>
      <p class="confirm-texte" id="confirm-texte"></p>
      <div class="confirm-boutons">
        <button class="btn btn-discret" id="confirm-non">Annuler</button>
        <button class="btn btn-principal" id="confirm-oui">Confirmer</button>
      </div>
    </div>
  </div>

  <!-- Petit message temporaire -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Sélecteur de fichier pour l'import (caché) -->
  <input type="file" id="fichier-import" accept="application/json,.json" hidden>

  <noscript>Cette application a besoin de JavaScript pour fonctionner.</noscript>
  <script src="app.js"></script>
</body>
</html>
